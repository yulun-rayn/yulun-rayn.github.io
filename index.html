<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Yulun Wu</title>
    <meta name="description" content="Yulun &quot;Rayn&quot; Wu, applied researcher at Capital One AI Foundations. Deep probabilistic modeling, causal inference, meta learning, reinforcement learning.">
    <script>document.documentElement.dataset.theme = localStorage.getItem("theme") === "dark" ? "dark" : "light";</script>
    <style>
      *, *::before, *::after { box-sizing: border-box; }
      html { -webkit-text-size-adjust: 100%; }
      body { margin: 0; background: var(--bg); color: var(--fg); transition: background-color .2s, color .2s; }
      img { max-width: 100%; }
      a { color: var(--link); }
      .muted { color: var(--muted); }
      .headshot { display: block; aspect-ratio: 1; object-fit: cover; }
      .contact, .pubs, .reviewing { list-style: none; margin: 0; padding: 0; }
      .pub-title, .pub-authors, .pub-meta { display: block; }
      .pub-meta { display: flex; flex-wrap: wrap; align-items: baseline; gap: .25em .9em; }
      .social { display: flex; gap: 1rem; }
      .social a { display: inline-flex; opacity: .75; transition: opacity .15s; }
      .social a:hover { opacity: 1; }
      .social img { width: 22px; height: 22px; }
      [data-theme="dark"] .social img { filter: invert(1); }

      .theme-toggle {
        position: fixed; top: 1rem; right: 1rem; z-index: 10;
        width: 2.25rem; height: 2.25rem; padding: 0;
        display: grid; place-items: center;
        background: var(--bg); color: var(--fg);
        border: 1px solid var(--border); border-radius: 50%;
        cursor: pointer; transition: border-color .15s, background-color .2s;
      }
      .theme-toggle:hover { border-color: var(--muted); }
      .theme-toggle svg { width: 1rem; height: 1rem; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
      .icon-sun, [data-theme="dark"] .icon-moon { display: none; }
      [data-theme="dark"] .icon-sun { display: block; }

      :root { --bg: #ffffff; --fg: #1f2328; --muted: #6b7280; --border: #ebebeb; --link: #0f766e; }
      [data-theme="dark"] { --bg: #111315; --fg: #e6e7e8; --muted: #9aa0a6; --border: #26292d; --link: #5ec4b6; }

      body { font: 16px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
      a { text-decoration: none; }
      a:hover { text-decoration: underline; text-underline-offset: .15em; }
      .page {
        max-width: 1060px; margin: 0 auto; padding: 5rem 2rem 2rem;
        display: grid; grid-template-columns: 250px minmax(0, 1fr); column-gap: 4.5rem;
      }

      .profile { grid-column: 1; grid-row: 1 / span 2; position: sticky; top: 5rem; align-self: start; }
      main { grid-column: 2; }
      .headshot { width: 100%; max-width: 220px; border-radius: 10px; margin-bottom: 1.25rem; }
      .name { font-size: 1.45rem; font-weight: 600; margin: 0; letter-spacing: -.01em; }
      .role { color: var(--muted); font-size: .9rem; margin: .2rem 0 1rem; }
      .contact { font-size: .82rem; color: var(--fg); margin-bottom: 1rem; }
      .sections-nav { display: flex; flex-direction: column; margin-top: 2rem; border-left: 1px solid var(--border); }
      .sections-nav a { color: var(--muted); font-size: .88rem; padding: .3rem 0 .3rem 1rem; margin-left: -1px; border-left: 1px solid transparent; }
      .sections-nav a:hover { color: var(--fg); border-left-color: var(--fg); text-decoration: none; }

      section { margin-bottom: 3.25rem; }
      section:first-child p { margin-top: 0; }
      h2 { font-size: 1.05rem; font-weight: 600; margin: 0 0 1.25rem; }
      .pub { padding: 1rem 0; border-top: 1px solid var(--border); }
      .pub:first-child { border-top: 0; padding-top: 0; }
      .pub-title { font-weight: 500; }
      .pub-authors { font-size: .875rem; color: var(--muted); margin: .15rem 0 .4rem; }
      .me { color: var(--fg); font-weight: 600; }
      .pub-meta { font-size: .85rem; }
      .pub-venue {
        font-size: .72rem; font-weight: 600; letter-spacing: .04em; text-transform: uppercase;
        color: var(--muted); border: 1px solid var(--border); border-radius: 999px; padding: .05rem .55rem;
      }

      .last-updated { margin: 1.5rem 0 0; font-size: .78rem; color: var(--muted); }

      @media (max-width: 860px) {
        .page { display: block; padding-top: 4rem; }
        .profile { position: static; margin-bottom: 3rem; }
        .headshot { max-width: 200px; }
        .sections-nav { display: none; }
      }

      .reviewing { font-size: .875rem; color: var(--muted); }
      .review-venue { color: var(--fg); font-weight: 500; margin-right: .3em; }
    </style>
  </head>

  <body>
    <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Switch to dark mode">
      <svg class="icon-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
      <svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
    </button>

    <div class="page">
      <header class="profile">
        <img id="headshot" class="headshot" alt="Photo of Yulun Wu">
        <div class="profile-text">
          <h1 class="name">Yulun <span class="muted">"Rayn"</span> Wu</h1>
          <p class="role">Applied Researcher, AI Foundations @ Capital One</p>
          <ul class="contact">
            <li>yulun <span class="muted">&lt;dot&gt;</span> wu <span class="muted">&lt;at&gt;</span> capitalone.com</li>
            <li>yulun <span class="muted">&lt;underscore&gt;</span> wu <span class="muted">&lt;at&gt;</span> berkeley.edu</li>
          </ul>
          <div class="social">
            <a href="https://scholar.google.com/citations?user=5QJJxS4AAAAJ" title="Google Scholar"><img src="google-scholar.svg" alt="Google Scholar"></a>
            <a href="https://github.com/yulun-rayn" title="GitHub"><img src="github.svg" alt="GitHub"></a>
            <a href="https://www.linkedin.com/in/yu-lun-wu/" title="LinkedIn"><img src="linkedin.svg" alt="LinkedIn"></a>
          </div>
          <nav class="sections-nav" aria-label="Sections">
            <a href="#about">About</a>
            <a href="#selected-publications">Selected Publications</a>
            <a href="#other-publications">Other Publications</a>
            <a href="#reviewing">Reviewer Service</a>
          </nav>
          <p class="last-updated">Last updated <time id="last-updated" datetime="2026-11-17">November 17, 2026</time></p>
        </div>
      </header>

      <main>
        <script src="sections/about.js"></script>
        <script src="sections/selected-publications.js"></script>
        <script src="sections/other-publications.js"></script>
        <script src="sections/reviewing.js"></script>
      </main>
    </div>

    <script src="site.js"></script>
  </body>
</html>
